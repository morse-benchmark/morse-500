# Minimal GRPO config for Qwen3-VL-4B with verl.
# Adjust field names to match your installed verl version.

trainer:
  name: grpo
  max_steps: 1000
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_generations: 4
  kl_coef: 0.02
  learning_rate: 1.0e-6
  seed: 7
  log_every: 10
  eval_every: 200
  save_every: 200

model:
  name_or_path: Qwen/Qwen3-VL-4B-Instruct
  trust_remote_code: true
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  gradient_checkpointing: true

data:
  train_file: fine_tuning/data/morse_train_grpo_train.jsonl
  eval_file: fine_tuning/data/morse_train_grpo_val.jsonl
  prompt_field: messages
  answer_field: answer
  video_field: video

reward:
  type: python
  function: fine_tuning.grpo_reward:reward_fn
