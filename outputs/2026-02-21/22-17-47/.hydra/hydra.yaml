hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model.path=Qwen/Qwen3-VL-4B-Instruct
    - model.tokenizer_path=Qwen/Qwen3-VL-4B-Instruct
    - model.trust_remote_code=true
    - +model.override_config._attn_implementation=eager
    - model.enable_gradient_checkpointing=true
    - model.use_remove_padding=false
    - engine.use_torch_compile=false
    - data.train_files=/fs/nexus-scratch/mrislam/morse-500/fine_tuning/data/morse_train_sft_train.parquet
    - data.val_files=/fs/nexus-scratch/mrislam/morse-500/fine_tuning/data/morse_train_sft_val.parquet
    - data.messages_key=messages
    - +data.video_key=videos
    - data.pad_mode=right
    - data.max_length=4096
    - data.train_batch_size=1
    - data.micro_batch_size_per_gpu=1
    - data.max_token_len_per_gpu=4096
    - data.use_dynamic_bsz=false
    - trainer.project_name=morse500
    - trainer.experiment_name=qwen3-vl-4b-verl-sft
    - trainer.logger=[console]
    - trainer.total_epochs=1
    - trainer.save_freq=50
    - trainer.test_freq=50
    - trainer.nnodes=1
    - trainer.n_gpus_per_node=1
  job:
    name: sft_trainer
    chdir: null
    override_dirname: +data.video_key=videos,+model.override_config._attn_implementation=eager,data.max_length=4096,data.max_token_len_per_gpu=4096,data.messages_key=messages,data.micro_batch_size_per_gpu=1,data.pad_mode=right,data.train_batch_size=1,data.train_files=/fs/nexus-scratch/mrislam/morse-500/fine_tuning/data/morse_train_sft_train.parquet,data.use_dynamic_bsz=false,data.val_files=/fs/nexus-scratch/mrislam/morse-500/fine_tuning/data/morse_train_sft_val.parquet,engine.use_torch_compile=false,model.enable_gradient_checkpointing=true,model.path=Qwen/Qwen3-VL-4B-Instruct,model.tokenizer_path=Qwen/Qwen3-VL-4B-Instruct,model.trust_remote_code=true,model.use_remove_padding=false,trainer.experiment_name=qwen3-vl-4b-verl-sft,trainer.logger=[console],trainer.n_gpus_per_node=1,trainer.nnodes=1,trainer.project_name=morse500,trainer.save_freq=50,trainer.test_freq=50,trainer.total_epochs=1
    id: ???
    num: ???
    config_name: sft_trainer_engine
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /fs/nexus-scratch/mrislam/morse-500
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /fs/nexus-scratch/mrislam/morse-500/.morse_venv/lib/python3.12/site-packages/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /fs/nexus-scratch/mrislam/morse-500/outputs/2026-02-21/22-17-47
    choices:
      profiler: profiler
      optim: fsdp
      engine: fsdp
      model: hf_model
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
